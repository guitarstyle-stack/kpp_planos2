name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: planos/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./planos

    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: ./planos

    - name: Run Lint
      run: npm run lint
      working-directory: ./planos

    - name: Run Type Check
      run: npm run type-check
      working-directory: ./planos
